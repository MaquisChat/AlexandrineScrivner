name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    container: swift:6.4.3-noble
    steps:
      - uses: actions/checkout@v5
      - name: Core tests
        run: swift test --package-path Core

  core-tests-mac:
    # The same tests on a Mac, where hashing uses Apple's own library instead of our fallback.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Core tests
        run: swift test --package-path Core

  mac-build:
    # Runs the same script the owner runs on their Mac: setup check, tests, project generation
    # and an unsigned compile of the test app for a device. The newest Xcode on the machine is used.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Choose the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
      - name: Build
        env:
          SCRIVNER_MIN_MACOS: "14"
          SCRIVNER_MIN_XCODE: "16"
        run: tools/mac-build.sh
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: build/logs/
          if-no-files-found: ignore

  session-check:
    # The session checker passes the worked example, media tags included, and catches faults
    # put into copies of it.
    runs-on: ubuntu-24.04
    container: swift:6.4.3-noble
    steps:
      - name: Install Perl and curl
        run: apt-get update && apt-get install -y --no-install-recommends perl curl ca-certificates
      - uses: actions/checkout@v5
      - name: Check the worked example
        run: tools/check-example.sh

  schema-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the schema checker
        working-directory: format
        run: npm ci --no-audit --no-fund
      - name: Schema check
        working-directory: format
        run: npm run validate
