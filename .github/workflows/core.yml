name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    container: swift:6.4.3-noble
    steps:
      - uses: actions/checkout@v5
      - name: Core tests
        run: swift test --package-path Core

  session-check:
    # The session checker passes the worked example, media tags included, and catches faults
    # put into copies of it.
    runs-on: ubuntu-24.04
    container: swift:6.4.3-noble
    steps:
      - name: Install Perl and curl
        run: apt-get update && apt-get install -y --no-install-recommends perl curl ca-certificates
      - uses: actions/checkout@v5
      - name: Check the worked example
        run: tools/check-example.sh

  schema-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the schema checker
        working-directory: format
        run: npm ci --no-audit --no-fund
      - name: Schema check
        working-directory: format
        run: npm run validate
